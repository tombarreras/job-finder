database_path: data/jobs.db
output_directory: output
log_level: INFO

# Employers share global ATS tenants, so a single Workday site returns
# Bangalore and Penang alongside Austin. A job is kept when its location
# contains any pattern below (case-insensitive).
#
# To search nationwide for software/QA roles, add markers like "CA", "WA",
# "New York", or set enabled: false to keep everything.
location_filter:
  enabled: true
  include:
    - Austin
    - Round Rock
    - Pflugerville
    - Cedar Park
    - Leander
    - Georgetown
    - Taylor
    - Hutto
    - Buda
    - Kyle
    - Bastrop
    - San Marcos
    - Wimberley
    - Texas
    - ", TX"
    - Remote
    # Employers name sites rather than cities. These are all in the Austin area
    # and would otherwise be dropped -- UT alone loses ~113 jobs without them.
    - UT MAIN CAMPUS
    - PICKLE RESEARCH CAMPUS
    - J J PICKLE RESEARCH CAMPUS
    - ONE TEXAS CENTER
    - MARINE SCIENCE INSTITUTE
  # Checked first and wins over `include`. Needed because bare "Remote" would
  # otherwise keep "Remote (Germany)" and friends.
  exclude:
    - Argentina
    - Australia
    - Austria
    - Belgium
    - Brazil
    - Bulgaria
    - Canada
    - Chile
    - China
    - Colombia
    - Czechia
    - Denmark
    - Dubai
    - Egypt
    - Finland
    - France
    - Germany
    - Hong Kong
    - Hungary
    - India
    - Indonesia
    - Ireland
    - Israel
    - Italy
    - Japan
    - Malaysia
    - Mexico
    - Netherlands
    - New Zealand
    - Norway
    - Pakistan
    - Peru
    - Philippines
    - Poland
    - Portugal
    - Romania
    - Saudi Arabia
    - Serbia
    - Singapore
    - Slovakia
    - South Africa
    - South Korea
    - Spain
    - Sweden
    - Switzerland
    - Taiwan
    - Thailand
    - Turkey
    - UAE
    - United Arab Emirates
    - United Kingdom
    - Vietnam

# Job Source Registry
# See: job_source_registry_instructions.md for complete list and validation procedure
#
# Before enabling any source:
# 1. Verify the careers URL is accessible
# 2. Identify the underlying ATS (Greenhouse, Lever, Ashby, JSON-LD, etc.)
# 3. Test that the collector can retrieve and parse actual job postings
# 4. Confirm duplicate detection works
# 5. Only then set enabled: true
#
# To find source identifiers:
# - Greenhouse: https://boards.greenhouse.io/ - look for company board URL
# - Lever: https://jobs.lever.co/ - check company URL slug
# - Ashby: Check company careers page for organization name
# - JSON-LD: Look for <script type="application/ld+json"> blocks on careers page

companies:
  # Priority 1: Austin Technology and Software (nationwide scope)

  - id: apple
    name: Apple
    enabled: false
    priority: high
    categories:
      - software
      - qa
      - it-support
    locations:
      - Austin, TX
      - Remote
    career_page_url: https://jobs.apple.com/en-us/search?location=austin-AST
    sources:
      - type: jsonld
        site_url: https://jobs.apple.com/en-us/search?location=austin-AST
        timeout_seconds: 30
    notes: "Custom search page - may need JSON-LD parsing or fallback to direct page check"

