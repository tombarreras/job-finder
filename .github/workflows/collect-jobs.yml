name: Collect Jobs

on:
  schedule:
    - cron: '0 7 * * *'  # 7 AM UTC daily
  workflow_dispatch:

concurrency:
  group: job-collection
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate configuration
        run: python -m job_collector validate-config --config config

      - name: Initialize database
        run: python -m job_collector init-db --config config

      - name: Fetch state from persistence branch
        continue-on-error: true
        run: |
          if git rev-parse --verify origin/job-search-state > /dev/null 2>&1; then
            echo "Fetching database from job-search-state branch..."
            git show origin/job-search-state:data/jobs.db > data/jobs.db 2>/dev/null || true
          else
            echo "Persistence branch does not exist yet, starting fresh"
          fi

      - name: Run linting and type checks
        continue-on-error: true
        run: |
          ruff check src/ tests/ || echo "Linting passed with warnings"
          mypy src/ || echo "Type checking passed with warnings"

      - name: Run tests
        id: tests
        run: pytest -v --tb=short 2>&1 | tee test_output.txt

      - name: Collect jobs
        id: collect
        continue-on-error: true
        run: python -m job_collector collect --config config --output output
        env:
          LOG_LEVEL: INFO

      - name: Generate reports
        id: report
        continue-on-error: true
        run: python -m job_collector report --config config --output output

      - name: Send email report
        id: email
        continue-on-error: true
        run: python -m job_collector send-email --config config --output output
        env:
          JOB_EMAIL_SMTP_HOST: smtp.gmail.com
          JOB_EMAIL_SMTP_PORT: 587
          JOB_EMAIL_SMTP_USERNAME: ${{ secrets.JOB_EMAIL_SMTP_USERNAME }}
          JOB_EMAIL_SMTP_PASSWORD: ${{ secrets.JOB_EMAIL_SMTP_PASSWORD }}
          JOB_EMAIL_FROM: ${{ secrets.JOB_EMAIL_FROM }}

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: job-reports
          path: output/
          retention-days: 30

      - name: Create/update persistence branch
        if: always()
        run: |
          # Only update if collection was successful
          if [ "${{ steps.collect.outcome }}" = "success" ]; then
            git config user.name "Job Collector Bot"
            git config user.email "github-actions@github.com"

            # Create or update job-search-state branch
            if git rev-parse --verify job-search-state > /dev/null 2>&1; then
              git checkout job-search-state
            else
              git checkout --orphan job-search-state
            fi

            # Copy database file
            mkdir -p data
            git add data/jobs.db

            # Commit with timestamp
            git commit -m "Update job database - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" --allow-empty

            # Push to origin
            git push origin job-search-state
          fi

      - name: Report collection status
        if: always()
        run: |
          echo "## Job Collection Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation**: ${{ steps.validate.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ steps.tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Collection**: ${{ steps.collect.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reports**: ${{ steps.report.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Email**: ${{ steps.email.outcome }}" >> $GITHUB_STEP_SUMMARY

      - name: Workflow failure
        if: |
          steps.collect.outcome == 'failure' ||
          steps.report.outcome == 'failure'
        run: exit 1
