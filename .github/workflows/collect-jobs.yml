name: Collect Jobs

on:
  schedule:
    # 07:00 UTC daily = 2 AM Central (CDT) / 1 AM Central (CST), Austin time.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      email_include:
        description: "delta = this run's new/changed jobs; all = backfill everything active"
        type: choice
        options: ["delta", "all"]
        default: "delta"
      email_max_emails:
        description: "Split the report across up to this many messages"
        default: "1"
      email_description_chars:
        description: "Per-job description cap in characters (blank = default 2000)"
        default: ""

concurrency:
  group: job-collection
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # NOTE: --config/--output are top-level arguments and must come BEFORE
      # the subcommand. Placing them after it is an argparse error.
      - name: Validate configuration
        id: validate
        run: python -m job_collector --config config validate-config

      - name: Restore database from persistence branch
        continue-on-error: true
        run: |
          git fetch origin job-search-state:refs/remotes/origin/job-search-state || true
          if git rev-parse --verify origin/job-search-state > /dev/null 2>&1; then
            echo "Restoring database from job-search-state branch"
            mkdir -p data
            git show origin/job-search-state:data/jobs.db > data/jobs.db
          else
            echo "Persistence branch does not exist yet, starting fresh"
          fi

      - name: Initialize database
        run: python -m job_collector --config config init-db

      - name: Run linting and type checks
        continue-on-error: true
        run: |
          ruff check src/ tests/ || echo "Linting reported issues"
          mypy src/ || echo "Type checking reported issues"

      # Informational only. Pre-existing failures in the legacy collectors must
      # not stop the nightly collection from running.
      - name: Run tests
        id: tests
        continue-on-error: true
        run: pytest -q --tb=short

      - name: Collect jobs
        id: collect
        run: python -m job_collector --config config --output output collect
        env:
          LOG_LEVEL: INFO

      - name: Generate reports
        id: report
        run: python -m job_collector --config config --output output report

      - name: Send email report
        id: email
        continue-on-error: true
        run: |
          python -m job_collector --config config --output output send-email \
            --include "${{ inputs.email_include || 'delta' }}" \
            --max-emails "${{ inputs.email_max_emails || '1' }}" \
            ${{ inputs.email_description_chars && format('--description-chars {0}', inputs.email_description_chars) || '' }}
        env:
          JOB_EMAIL_SMTP_HOST: smtp.gmail.com
          JOB_EMAIL_SMTP_PORT: 587
          JOB_EMAIL_SMTP_USERNAME: ${{ secrets.JOB_EMAIL_SMTP_USERNAME }}
          JOB_EMAIL_SMTP_PASSWORD: ${{ secrets.JOB_EMAIL_SMTP_PASSWORD }}
          JOB_EMAIL_FROM: ${{ secrets.JOB_EMAIL_FROM }}

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-reports
          path: output/
          retention-days: 30

      - name: Persist database to state branch
        if: always() && steps.collect.outcome == 'success'
        run: |
          git config user.name "Job Collector Bot"
          git config user.email "github-actions@github.com"

          # data/jobs.db is gitignored, so stash it outside the tree before
          # switching branches and force-add it on the other side.
          tmp="$(mktemp -d)"
          cp data/jobs.db "$tmp/jobs.db"

          if git rev-parse --verify origin/job-search-state > /dev/null 2>&1; then
            git checkout -B job-search-state origin/job-search-state
          else
            git checkout --orphan job-search-state
            git rm -rf --cached . > /dev/null 2>&1 || true
          fi

          mkdir -p data
          cp "$tmp/jobs.db" data/jobs.db
          git add -f data/jobs.db
          git commit -m "Update job database - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" --allow-empty
          git push origin job-search-state

      - name: Report collection status
        if: always()
        run: |
          {
            echo "## Job Collection Run"
            echo ""
            echo "- **Validation**: ${{ steps.validate.outcome }}"
            echo "- **Tests**: ${{ steps.tests.outcome }}"
            echo "- **Collection**: ${{ steps.collect.outcome }}"
            echo "- **Reports**: ${{ steps.report.outcome }}"
            echo "- **Email**: ${{ steps.email.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
